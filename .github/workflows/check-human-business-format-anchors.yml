name: Check Human Business Format Anchors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-human-business-format-anchors.yml'
      - 'scripts/check_human_business_format_anchors.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Check anchors only
        run: |
          python scripts/check_human_business_format_anchors.py
          cat temp/.human-business-anchor-check.json
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.human-business-anchor-check.json
          if git diff --cached --quiet; then
            echo 'Anchor check unchanged.'
          else
            git commit -m 'chore(temp): refresh human-business anchor check [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
