name: Extract High Risk Markdown Contexts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-high-risk-markdown-contexts.yml'
      - 'scripts/extract_high_risk_markdown_contexts.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Refresh audit then extract high-risk contexts
        run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/extract_high_risk_markdown_contexts.py
          cat temp/.semantic-high-risk-contexts.json
      - name: Commit compact diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.semantic-completeness-audit.json temp/.semantic-high-risk-contexts.json
          if git diff --cached --quiet; then
            echo 'High-risk diagnostics unchanged.'
          else
            git commit -m 'chore(temp): refresh high-risk formatting contexts [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
