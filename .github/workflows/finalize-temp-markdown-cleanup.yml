name: Finalize Temp Markdown Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-temp-markdown-cleanup.yml'
      - 'scripts/finalize_temp_markdown_cleanup.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final cleanup and repository validation
        run: |
          python scripts/finalize_temp_markdown_cleanup.py \
            --root temp \
            --raw-report temp/.raw-format-report.json \
            --prompt '.prompt/Markdown文档整理与修复通用提示词.md' \
            --report temp/.final-markdown-validation.json
          cat temp/.final-markdown-validation.json
      - name: Commit safe final changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp '.prompt/Markdown文档整理与修复通用提示词.md'
          if git diff --cached --quiet; then
            echo 'No final Markdown changes required.'
            exit 0
          fi
          git commit -m 'docs(temp): finalize Markdown cleanup [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
