name: Update Markdown Repair Prompt Completion Rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-markdown-repair-prompt-completion-rules.yml'
      - 'scripts/update_markdown_repair_prompt_completion_rules.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Update prompt rules
        run: python scripts/update_markdown_repair_prompt_completion_rules.py
      - name: Commit prompt update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '.prompt/Markdown文档整理与修复通用提示词.md'
          if git diff --cached --quiet; then
            echo 'Prompt already up to date.'
            exit 0
          fi
          git commit -m 'docs(prompt): add semantic completion and promo review rules [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
