name: Reflow Confirmed Giant OCR Lines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reflow-confirmed-giant-ocr-lines.yml'
      - 'scripts/reflow_confirmed_giant_ocr_lines.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Reflow only confirmed giant OCR lines
        run: python scripts/reflow_confirmed_giant_ocr_lines.py
      - name: Refresh semantic audit
        run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/summarize_semantic_audit_issues.py
      - name: Commit repaired Markdown and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'temp/《开窍开智开悟5》.md' 'temp/《玩转人性》.md' 'temp/做局大师-人间博弈之术.md' temp/.giant-ocr-reflow-report.json temp/.semantic-completeness-audit.json temp/.semantic-audit-issue-index.tsv temp/.semantic-audit-issue-summary.json
          if git diff --cached --quiet; then
            echo 'No giant OCR reflow changes.'
          else
            git commit -m 'docs(temp): reflow confirmed giant OCR lines [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
