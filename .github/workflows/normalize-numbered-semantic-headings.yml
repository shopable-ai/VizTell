name: Normalize Repeated Numbered Semantic Headings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-numbered-semantic-headings.yml'
      - 'scripts/normalize_numbered_semantic_headings.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize repeated numbered title families
        run: |
          python scripts/normalize_numbered_semantic_headings.py \
            --root temp \
            --report temp/.numbered-heading-normalization.json
          cat temp/.numbered-heading-normalization.json
      - name: Commit safe title repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp
          if git diff --cached --quiet; then
            echo 'No repeated numbered semantic headings required repair.'
            exit 0
          fi
          git commit -m 'docs(temp): normalize numbered semantic headings [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
