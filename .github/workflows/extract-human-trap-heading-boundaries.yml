name: Extract Human Trap Heading Boundaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-human-trap-heading-boundaries.yml'
      - 'scripts/extract_human_trap_heading_boundaries.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git fetch origin main
          git rebase origin/main
      - run: python scripts/extract_human_trap_heading_boundaries.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.human-trap-heading-boundaries.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(temp): audit trap heading boundaries [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
