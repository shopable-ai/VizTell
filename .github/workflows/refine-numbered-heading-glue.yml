name: Refine Numbered Heading Glue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-numbered-heading-glue.yml'
      - 'scripts/refine_numbered_heading_glue.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine glued numbered headings
        run: |
          python scripts/refine_numbered_heading_glue.py \
            --source-report temp/.numbered-heading-normalization.json \
            --report temp/.numbered-heading-refinement.json
          cat temp/.numbered-heading-refinement.json
      - name: Commit safe refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp
          if git diff --cached --quiet; then
            echo 'No numbered-heading refinements required.'
            exit 0
          fi
          git commit -m 'docs(temp): refine numbered heading glue [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
