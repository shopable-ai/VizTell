name: Format One Temp Markdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-temp-one.yml'
  workflow_dispatch:

concurrency:
  group: format-temp-one-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  format-one:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup converter
        run: pip install --quiet opencc-python-reimplemented
      - name: Format 万能厚黑不黑模式 only
        run: |
          set +e
          python - <<'PY' > /tmp/format-run.log 2>&1
          import json,re
          from pathlib import Path
          from opencc import OpenCC
          cc=OpenCC('t2s')
          src=Path('temp/《万能厚黑不黑模式》/index.md')
          dst=Path('temp/《万能厚黑不黑模式》/万能厚黑不黑模式.md')
          raw=src.read_text(encoding='utf-8')
          PAGE=re.compile(r'^\s*<!--\s*page\s*:\s*(\d+)\s*-->\s*$',re.I)
          IMG=re.compile(r'!\[[^\]]*\]\([^\n)]*\)|!\[[^\]]*\]\[[^\]\n]*\]')
          H=re.compile(r'^(#{1,6})\s+(.*)$')
          IMAGE_COMMENT=re.compile(r'^\s*<!--\s*Image\s*\([^>]*\)\s*-->\s*$',re.I)
          COMPANY=re.compile(r'^\s*【天使投资有限公司】\s*')
          PROMO=re.compile(r'^\s*\d*\s*[（(]更多绝密电子书加微信[^\n]*$',re.I)
          pages=[]; no=None; buf=[]
          for line in raw.splitlines():
            m=PAGE.match(line)
            if m:
              if no is not None: pages.append((no,buf))
              no=int(m.group(1)); buf=[]
            else: buf.append(line)
          if no is not None: pages.append((no,buf))
          images_before=IMG.findall(raw)
          assert pages and pages[0][0]==1
          toc_pages={10,11}
          out=['# 万能厚黑不黑模式','']; toc_images=[]
          stats={'headers':0,'promos':0,'image_comments':0,'hfix':0,'moved':0,'traditional_chars_changed':0}
          duplicate_titles={'万能厚黑不黑模式°','万能厚黑不黑模式','石能厚黑不黑模式'}

          def simplify_preserving_urls(line):
            # URLs/image paths are split out and retained byte-for-byte.
            parts=re.split(r'(https?\s*:\s*//\S+)',line)
            outp=[]
            for p in parts:
              if re.match(r'https?\s*:',p): outp.append(p)
              else:
                q=cc.convert(p)
                stats['traditional_chars_changed'] += sum(1 for a,b in zip(p,q) if a!=b) + abs(len(p)-len(q))
                outp.append(q)
            return ''.join(outp)

          for pno,block in pages:
            text=[]; imgs=[]
            for line in block:
              s=line.rstrip()
              im=IMG.fullmatch(s.strip())
              if im: imgs.append(im.group(0)); continue
              if IMAGE_COMMENT.match(s): stats['image_comments']+=1; continue
              s,n=COMPANY.subn('',s,1); stats['headers']+=n
              if PROMO.match(s.strip()): stats['promos']+=1; continue
              if s.strip() in {'198g','\\'}: continue
              hm=H.match(s.strip())
              if hm:
                title=cc.convert(hm.group(2).strip())
                if title in duplicate_titles: continue
                if pno < 12:
                  # Front matter must not share chapter heading level.
                  s='**'+title+'**'
                else:
                  if title=='开篇': s='## 开篇'
                  elif re.match(r'^第[一二三四五六七八九十百零〇两0-9]+章',title): s='## '+title
                  elif title.startswith('【') and title.endswith('篇】'): s='## '+title
                  else: s='### '+title
                stats['hfix']+=1
              else:
                s=simplify_preserving_urls(s)
              text.append(s)
            norm=[]
            for x in text:
              if not x.strip():
                if norm and norm[-1]!='': norm.append('')
              else: norm.append(x.rstrip())
            while norm and norm[-1]=='': norm.pop()
            if pno in toc_pages:
              toc_images.extend(imgs); continue
            if norm:
              if out and out[-1]!='': out.append('')
              out.extend(norm)
            if imgs:
              if out and out[-1]!='': out.append('')
              out.extend(imgs); stats['moved']+=len(imgs)
          if toc_images:
            # Directory screenshots remain between front matter and body, but OCR directory text is removed.
            # Insert immediately before first main-body content (page 12 material).
            # Front matter pages 1-9 have already been emitted; locate by the last page-9 image reference.
            marker='![第9页原始页面图](assets/page-009.png)'
            try: idx=out.index(marker)+1
            except ValueError: idx=2
            out[idx:idx]=['','**目录**','']+toc_images+['']
            stats['moved']+=len(toc_images)
          norm=[]
          for x in out:
            if not x.strip():
              if norm and norm[-1]!='': norm.append('')
            else: norm.append(x.rstrip())
          final='\n'.join(norm).strip()+'\n'
          images_after=IMG.findall(final)
          assert images_after==images_before,'images changed/order changed'
          assert len(re.findall(r'^#\s+',final,re.M))==1,'not one H1'
          assert not re.search(r'^\s*<!--\s*page\s*:',final,re.M|re.I),'page comments remain'
          assert '更多绝密电子书加微信' not in final,'promo footer remains'
          assert '【天使投资有限公司】' not in final,'repeated header remains'
          dst.write_text(final,encoding='utf-8'); src.unlink()
          visible=IMG.sub('',final); visible=re.sub(r'^#{1,6}\s*','',visible,flags=re.M)
          report={'file':str(dst),'source_bytes':len(raw.encode()),'output_bytes':len(final.encode()),
            'pages_detected':len(pages),'toc_pages_removed':[10,11],'page_markers_removed':len(pages),
            'repeated_headers_removed':stats['headers'],'repeated_promo_footers_removed':stats['promos'],
            'conversion_image_comments_removed':stats['image_comments'],'heading_fixes':stats['hfix'],
            'traditional_to_simplified':True,'traditional_character_changes':stats['traditional_chars_changed'],
            'page_images_moved_after_text':stats['moved'],'image_refs_before':len(images_before),
            'image_refs_after':len(images_after),'image_refs_changed':images_before!=images_after,
            'visible_body_chars':len(re.sub(r'\s+','',visible))}
          Path('temp/.format-progress.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          code=$?
          echo "exit_code=$code" > temp/.format-progress.log
          cat /tmp/format-run.log >> temp/.format-progress.log
          exit 0
      - name: Persist result or diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'temp/《万能厚黑不黑模式》' temp/.format-progress.json temp/.format-progress.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(temp): process 万能厚黑不黑模式 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
