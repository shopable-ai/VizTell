name: Inspect One Temp Markdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-temp-one.yml'
  workflow_dispatch:

concurrency:
  group: format-temp-one-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  inspect-one:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect 人性商战 only
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          path=Path('temp/《人性商战(线下3天2夜全文字版)》.md')
          raw=path.read_text(encoding='utf-8')
          PAGE=re.compile(r'^\s*<!--\s*page\s*:\s*(\d+)\s*-->\s*$',re.I)
          IMG=re.compile(r'!\[[^\]]*\]\([^\n)]*\)|!\[[^\]]*\]\[[^\]\n]*\]')
          H=re.compile(r'^(#{1,6})\s+(.*)$')
          pages=[]; no=None; buf=[]
          for line in raw.splitlines():
            m=PAGE.match(line)
            if m:
              if no is not None: pages.append((no,buf))
              no=int(m.group(1)); buf=[]
            else: buf.append(line)
          if no is not None: pages.append((no,buf))
          opening=[]
          for pno,block in pages[:18]:
            txt=[]; heads=[]; imgs=0
            for line in block:
              s=line.strip()
              if not s: continue
              if IMG.fullmatch(s): imgs+=1; continue
              hm=H.match(s)
              if hm: heads.append([len(hm.group(1)),hm.group(2)[:120]]); s=hm.group(2)
              if len(txt)<10: txt.append(s[:200])
            opening.append({'page':pno,'images':imgs,'headings':heads[:10],'text':txt})
          report={'file':str(path),'bytes':len(raw.encode()),'lines':len(raw.splitlines()),
            'page_count':len(pages),'image_refs':len(IMG.findall(raw)),'page_markers':len(re.findall(r'^\s*<!--\s*page\s*:',raw,re.M|re.I)),
            'h1':len(re.findall(r'^#\s+',raw,re.M)),'h2':len(re.findall(r'^##\s+',raw,re.M)),'h3':len(re.findall(r'^###\s+',raw,re.M)),
            'common_strings':{s:raw.count(s) for s in ['目录','微信','人性商战','第1天','第一天','第2天','第二天','第3天','第三天','课程']},
            'opening_pages':opening}
          Path('temp/.format-progress.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Persist inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.format-progress.json
          git commit -m 'chore(temp): inspect 人性商战 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
