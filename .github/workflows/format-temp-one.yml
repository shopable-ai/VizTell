name: Inspect One Temp Markdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-temp-one.yml'
  workflow_dispatch:

concurrency:
  group: format-temp-one-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  inspect-one:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect only
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          path=Path('temp/《458条人性顶级秘术》/index.md')
          raw=path.read_text(encoding='utf-8')
          PAGE=re.compile(r'^\s*<!--\s*page\s*:\s*(\d+)\s*-->\s*$',re.I)
          IMG=re.compile(r'!\[[^\]]*\]\([^\n)]*\)|!\[[^\]]*\]\[[^\]\n]*\]')
          H=re.compile(r'^(#{1,6})\s+(.*)$')
          pages=[]; no=None; buf=[]
          for line in raw.splitlines():
            m=PAGE.match(line)
            if m:
              if no is not None: pages.append((no,buf))
              no=int(m.group(1)); buf=[]
            else: buf.append(line)
          if no is not None: pages.append((no,buf))
          rows=[]
          for pno,block in pages[:25]:
            text=[]; heads=[]; imgs=0
            for line in block:
              s=line.strip()
              if not s: continue
              if IMG.fullmatch(s): imgs+=1; continue
              hm=H.match(s)
              if hm:
                heads.append([len(hm.group(1)),hm.group(2)[:100]]); s=hm.group(2)
              if len(text)<8: text.append(s[:180])
            rows.append({'page':pno,'images':imgs,'headings':heads[:8],'text':text})
          report={
            'file':str(path),'bytes':len(raw.encode()),'lines':len(raw.splitlines()),
            'page_count':len(pages),'image_refs':len(IMG.findall(raw)),
            'page_markers':len(re.findall(r'^\s*<!--\s*page\s*:',raw,re.M|re.I)),
            'h1':len(re.findall(r'^#\s+',raw,re.M)),'h2':len(re.findall(r'^##\s+',raw,re.M)),
            'common_strings':{s:raw.count(s) for s in ['目录','朋友圈每日更新','卧龙营销内部资料','人性顶级秘术','微信']},
            'opening_pages':rows}
          Path('temp/.format-progress.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Persist report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.format-progress.json
          git commit -m 'chore(temp): inspect 458条人性顶级秘术 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
