name: Inspect One Temp Markdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-temp-one.yml'
  workflow_dispatch:

concurrency:
  group: format-temp-one-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect-one:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect opening pages only
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          path=Path('temp/008《布局锦囊3.0》/index.md')
          raw=path.read_text(encoding='utf-8')
          PAGE=re.compile(r'^\s*<!--\s*page\s*:\s*(\d+)\s*-->\s*$',re.I)
          IMG=re.compile(r'!\[[^\]]*\]\([^\n)]*\)|!\[[^\]]*\]\[[^\]\n]*\]')
          H=re.compile(r'^(#{1,6})\s+(.*)$')
          pages=[]; no=None; buf=[]
          for line in raw.splitlines():
            m=PAGE.match(line)
            if m:
              if no is not None: pages.append((no,buf))
              no=int(m.group(1)); buf=[]
            else: buf.append(line)
          if no is not None: pages.append((no,buf))
          rows=[]
          for pno,block in pages[:30]:
            text=[]; heads=[]; imgs=[]
            for line in block:
              s=line.strip()
              if not s: continue
              im=IMG.fullmatch(s)
              if im: imgs.append(im.group(0)); continue
              hm=H.match(s)
              if hm:
                heads.append([len(hm.group(1)),hm.group(2)[:120]])
                s=hm.group(2)
              if len(text)<12: text.append(s[:220])
            rows.append({'page':pno,'headings':heads[:12],'image_count':len(imgs),'text':text})
          Path('temp/.format-progress.json').write_text(json.dumps({'file':str(path),'opening_pages':rows},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Persist inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- temp/.format-progress.json
          git commit -m 'chore(temp): inspect 布局锦囊3.0 opening [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
