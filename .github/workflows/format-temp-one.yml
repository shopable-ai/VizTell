name: Format One Temp Markdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-temp-one.yml'
  workflow_dispatch:

concurrency:
  group: format-temp-one-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-one:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 布局锦囊1.0 formatter and keep diagnostics
        run: |
          set +e
          python scripts/format_布局锦囊1_0.py > /tmp/format-run.log 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            cat /tmp/format-run.log
          } > temp/.format-progress.log
          cat temp/.format-progress.log

      - name: Persist result or diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'temp/007《布局锦囊1.0》' 'temp/.format-progress.json' 'temp/.format-progress.log'
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'docs(temp): process 布局锦囊1.0 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
