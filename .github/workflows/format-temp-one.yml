name: Normalize Temp Markdown Book Headers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-temp-one.yml'
      - 'scripts/fix_temp_book_headers.py'
  workflow_dispatch:

concurrency:
  group: normalize-temp-book-headers-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  normalize-headers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize first line of every temp book Markdown
        run: |
          python scripts/fix_temp_book_headers.py --root temp --report /tmp/temp-header-report.json
          cat /tmp/temp-header-report.json

      - name: Commit header-only repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp
          if git diff --cached --quiet; then
            echo 'No temp header changes required.'
            exit 0
          fi
          git commit -m 'docs(temp): normalize book title as first line [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
