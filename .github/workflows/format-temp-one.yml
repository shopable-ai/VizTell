name: Format One Temp Markdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-temp-one.yml'
  workflow_dispatch:

concurrency:
  group: format-temp-one-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  format-one:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup converter
        run: pip install --quiet opencc-python-reimplemented
      - name: Format 人心探索（动机篇） only
        run: |
          set +e
          python - <<'PY' > /tmp/format-run.log 2>&1
          import json,re
          from pathlib import Path
          from opencc import OpenCC
          cc=OpenCC('t2s')
          src=Path('temp/《人心探索（动机篇）》/index.md')
          dst=Path('temp/《人心探索（动机篇）》/人心探索（动机篇）.md')
          raw=src.read_text(encoding='utf-8')
          PAGE=re.compile(r'^\s*<!--\s*page\s*:\s*(\d+)\s*-->\s*$',re.I)
          IMG=re.compile(r'!\[[^\]]*\]\([^\n)]*\)|!\[[^\]]*\]\[[^\]\n]*\]')
          H=re.compile(r'^(#{1,6})\s+(.*)$')
          CHAPTER=re.compile(r'^第\s*(\d+)\s*章\s*(.*)$')
          IMAGE_COMMENT=re.compile(r'^\s*<!--\s*Image\s*\([^>]*\)\s*-->\s*$',re.I)
          pages=[]; no=None; buf=[]
          for line in raw.splitlines():
            m=PAGE.match(line)
            if m:
              if no is not None: pages.append((no,buf))
              no=int(m.group(1)); buf=[]
            else: buf.append(line)
          if no is not None: pages.append((no,buf))
          assert pages and pages[0][0]==1
          images_before=IMG.findall(raw)
          toc_pages={1,2,3}
          chapter_titles={}; toc_images=[]
          for pno,block in pages:
            if pno not in toc_pages: continue
            for line in block:
              im=IMG.fullmatch(line.strip())
              if im: toc_images.append(im.group(0)); continue
              hm=H.match(line.strip())
              text=hm.group(2).strip() if hm else line.strip()
              cm=CHAPTER.match(text.replace('第1章遇','第1章 遇'))
              if cm:
                n=int(cm.group(1)); title=cc.convert(text)
                title=re.sub(r'^第\s*(\d+)\s*章\s*',lambda m:f'第{m.group(1)}章 ',title)
                title=re.sub(r'\s+',' ',title).strip()
                chapter_titles[n]=title
          assert len(chapter_titles)>=12, f'chapter TOC incomplete: {len(chapter_titles)}'

          stats={'image_comments':0,'chapter_fixes':0,'other_heading_fixes':0,'moved':0,'traditional_changes':0}
          out=['# 人心探索（动机篇）','']
          if toc_images:
            out+=['**目录**','']+toc_images+['']; stats['moved']+=len(toc_images)

          for pno,block in pages:
            if pno in toc_pages: continue
            text=[]; imgs=[]
            for line in block:
              s=line.rstrip()
              im=IMG.fullmatch(s.strip())
              if im: imgs.append(im.group(0)); continue
              if IMAGE_COMMENT.match(s): stats['image_comments']+=1; continue
              hm=H.match(s.strip())
              plain=hm.group(2).strip() if hm else s.strip()
              converted=cc.convert(plain)
              stats['traditional_changes'] += sum(1 for a,b in zip(plain,converted) if a!=b)+abs(len(plain)-len(converted))
              cm=CHAPTER.match(converted)
              if cm:
                n=int(cm.group(1)); canonical=chapter_titles.get(n)
                if canonical:
                  s='## '+canonical
                else:
                  s='## '+re.sub(r'^第\s*(\d+)\s*章\s*',lambda m:f'第{m.group(1)}章 ',converted)
                stats['chapter_fixes']+=1
              elif hm:
                # Non-chapter visual headings belong inside the current chapter.
                s='### '+converted
                stats['other_heading_fixes']+=1
              else:
                s=cc.convert(s)
              text.append(s)
            norm=[]
            for x in text:
              if not x.strip():
                if norm and norm[-1]!='': norm.append('')
              else: norm.append(x.rstrip())
            while norm and norm[-1]=='': norm.pop()
            if norm:
              if out and out[-1]!='': out.append('')
              out.extend(norm)
            if imgs:
              if out and out[-1]!='': out.append('')
              out.extend(imgs); stats['moved']+=len(imgs)

          norm=[]
          for x in out:
            if not x.strip():
              if norm and norm[-1]!='': norm.append('')
            else: norm.append(x.rstrip())
          final='\n'.join(norm).strip()+'\n'
          images_after=IMG.findall(final)
          assert images_after==images_before,'images changed/order changed'
          assert len(re.findall(r'^#\s+',final,re.M))==1,'not one H1'
          assert not re.search(r'^\s*<!--\s*page\s*:',final,re.M|re.I),'page comments remain'
          # All 13 chapters should occur in body once the book is complete.
          found=set(int(x) for x in re.findall(r'^##\s+第(\d+)章\b',final,re.M))
          assert len(found)>=12, f'too few body chapters: {sorted(found)}'
          dst.write_text(final,encoding='utf-8'); src.unlink()
          visible=IMG.sub('',final); visible=re.sub(r'^#{1,6}\s*','',visible,flags=re.M)
          report={'file':str(dst),'source_bytes':len(raw.encode()),'output_bytes':len(final.encode()),
            'pages_detected':len(pages),'toc_ocr_pages_removed':3,'page_markers_removed':len(pages),
            'chapter_headings_from_toc':len(chapter_titles),'chapter_heading_fixes':stats['chapter_fixes'],
            'other_heading_fixes':stats['other_heading_fixes'],'conversion_image_comments_removed':stats['image_comments'],
            'traditional_to_simplified':stats['traditional_changes']>0,'traditional_character_changes':stats['traditional_changes'],
            'page_images_moved_after_text':stats['moved'],'image_refs_before':len(images_before),
            'image_refs_after':len(images_after),'image_refs_changed':images_before!=images_after,
            'visible_body_chars':len(re.sub(r'\s+','',visible))}
          Path('temp/.format-progress.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          code=$?
          echo "exit_code=$code" > temp/.format-progress.log
          cat /tmp/format-run.log >> temp/.format-progress.log
          exit 0
      - name: Persist result or diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'temp/《人心探索（动机篇）》' temp/.format-progress.json temp/.format-progress.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(temp): process 人心探索（动机篇） [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
