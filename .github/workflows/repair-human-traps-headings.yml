name: Repair Human Traps Headings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-human-traps-headings.yml'
      - 'scripts/repair_human_traps_headings.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Restore explicit trap headings
        run: python scripts/repair_human_traps_headings.py
      - name: Refresh semantic audit
        run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/summarize_semantic_audit_issues.py
      - name: Commit repaired Markdown and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'temp/《人性陷阱》/index.md' temp/.human-traps-heading-repair.json temp/.semantic-completeness-audit.json temp/.semantic-audit-issue-index.tsv temp/.semantic-audit-issue-summary.json
          if git diff --cached --quiet; then
            echo 'No trap-heading changes.'
          else
            git commit -m 'docs(temp): restore explicit trap headings [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
