name: Postprocess Raw Markdown Syntax

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/postprocess-raw-markdown-syntax.yml'
      - 'scripts/postprocess_raw_markdown_syntax.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postprocess:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair embedded headings and scene separators
        run: |
          python scripts/postprocess_raw_markdown_syntax.py \
            --source-report temp/.raw-format-report.json \
            --report temp/.raw-syntax-postprocess.json
          cat temp/.raw-syntax-postprocess.json
      - name: Commit syntax repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp
          if git diff --cached --quiet; then
            echo 'No raw Markdown syntax repairs required.'
            exit 0
          fi
          git commit -m 'docs(temp): postprocess raw Markdown syntax [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
