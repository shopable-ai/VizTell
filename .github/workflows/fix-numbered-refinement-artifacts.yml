name: Fix Numbered Refinement Artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-numbered-refinement-artifacts.yml'
      - 'scripts/fix_numbered_refinement_artifacts.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix refinement artifacts
        run: |
          python scripts/fix_numbered_refinement_artifacts.py \
            --target 'temp/《洗脑的最高境界》.md' \
            --refiner scripts/refine_numbered_heading_glue.py \
            --report temp/.numbered-refinement-artifact-fix.json
          cat temp/.numbered-refinement-artifact-fix.json
      - name: Commit corrected file and permanent bug fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp scripts/refine_numbered_heading_glue.py
          if git diff --cached --quiet; then
            echo 'No refinement artifacts remain.'
            exit 0
          fi
          git commit -m 'docs(temp): fix numbered refinement artifacts [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
