name: Extract Human Business Contacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-human-business-contacts.yml'
      - 'scripts/extract_human_business_contacts.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Extract contact contexts
        run: |
          python scripts/extract_human_business_contacts.py
          cat temp/.human-business-contact-contexts.tsv
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.human-business-contact-contexts.tsv
          if git diff --cached --quiet; then
            echo 'Contact contexts unchanged.'
          else
            git commit -m 'chore(temp): refresh human-business contact contexts [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
