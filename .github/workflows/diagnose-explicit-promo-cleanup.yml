name: Diagnose Explicit Promo Cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-explicit-promo-cleanup.yml'
      - 'scripts/diagnose_explicit_promo_cleanup.py'
  workflow_dispatch:
concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git fetch origin main
          git rebase origin/main
      - run: PYTHONPATH=scripts python scripts/diagnose_explicit_promo_cleanup.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.explicit-promo-cleanup-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(temp): refresh promo cleanup diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
