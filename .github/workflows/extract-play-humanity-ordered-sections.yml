name: Extract Play Humanity Ordered Sections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-play-humanity-ordered-sections.yml'
      - 'scripts/extract_play_humanity_ordered_sections.py'
  workflow_dispatch:
concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git fetch origin main
          git rebase origin/main
      - run: python scripts/extract_play_humanity_ordered_sections.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.play-humanity-ordered-sections.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(temp): refresh ordered Play Humanity sections [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
