name: Repair Human Mind Section 15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-human-mind-section15.yml'
      - 'scripts/repair_human_mind_section15.py'
  workflow_dispatch:
concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git fetch origin main
          git rebase origin/main
      - run: python scripts/repair_human_mind_section15.py
      - run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/summarize_semantic_audit_issues.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'temp/《人性心法》/index.md' temp/.human-mind-section15-repair.json temp/.semantic-completeness-audit.json temp/.semantic-audit-issue-index.tsv temp/.semantic-audit-issue-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(temp): repair Human Mind section 15 [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
