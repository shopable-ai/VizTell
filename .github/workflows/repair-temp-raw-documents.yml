name: Repair Raw Temp Markdown Documents

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-temp-raw-documents.yml'
      - 'scripts/repair_temp_raw_documents.py'
  workflow_dispatch:

concurrency:
  group: repair-temp-raw-documents-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair-raw:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Format remaining raw OCR/PDF Markdown
        run: |
          python scripts/repair_temp_raw_documents.py \
            --root temp \
            --report temp/.raw-format-report.json
          cat temp/.raw-format-report.json

      - name: Commit safe repairs and permanent detector fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp scripts/repair_temp_markdown_structure.py
          if git diff --cached --quiet; then
            echo 'No remaining raw Markdown repairs required.'
            exit 0
          fi
          git commit -m 'docs(temp): format remaining raw Markdown documents [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
