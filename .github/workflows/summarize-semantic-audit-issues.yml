name: Summarize Semantic Audit Issues

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/summarize-semantic-audit-issues.yml'
      - 'scripts/summarize_semantic_audit_issues.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summarize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Refresh audit and issue index
        run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/summarize_semantic_audit_issues.py
          cat temp/.semantic-audit-issue-index.tsv
      - name: Commit issue index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.semantic-completeness-audit.json temp/.semantic-audit-issue-index.tsv
          if git diff --cached --quiet; then
            echo 'Semantic issue index unchanged.'
          else
            git commit -m 'chore(temp): refresh semantic audit issue index [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
