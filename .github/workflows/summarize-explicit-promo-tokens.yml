name: Summarize Explicit Promo Tokens
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/summarize-explicit-promo-tokens.yml'
      - 'scripts/summarize_explicit_promo_tokens.py'
  workflow_dispatch:
concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  summarize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git fetch origin main
          git rebase origin/main
      - run: python scripts/summarize_explicit_promo_tokens.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.explicit-promo-token-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(temp): refresh explicit promo token summary [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
