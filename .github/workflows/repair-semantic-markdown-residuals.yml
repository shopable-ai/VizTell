name: Repair Semantic Markdown Residuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-semantic-markdown-residuals.yml'
      - 'scripts/repair_semantic_markdown_residuals.py'
      - 'scripts/update_markdown_prompt_completion_rules.py'
  workflow_dispatch:

concurrency:
  group: repair-semantic-markdown-residuals-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase to latest main before content repair
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Update repository completion rules
        run: python scripts/update_markdown_prompt_completion_rules.py

      - name: Repair semantic false-pass residuals
        run: |
          python scripts/repair_semantic_markdown_residuals.py \
            --root temp \
            --report temp/.semantic-residual-repair.json \
            --apply
          cat temp/.semantic-residual-repair.json

      - name: Normalize objective invariants
        run: |
          python scripts/finalize_temp_markdown_invariants.py \
            --root temp \
            --report temp/.format-invariant-repair.json \
            --apply

      - name: Re-run current-content audit
        run: |
          python scripts/audit_and_repair_temp_markdown.py \
            --root temp \
            --report temp/.content-format-audit.json \
            --apply

      - name: Refresh concise review queue
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path('temp/.content-format-audit.json').read_text(encoding='utf-8'))
          review = [
              {
                  'path': item.get('path'),
                  'status': item.get('status'),
                  'issues': item.get('issues', []),
                  'metrics': item.get('metrics', {}),
                  'history': item.get('history', {}),
              }
              for item in src.get('audit', [])
              if item.get('status') != 'pass'
          ]
          residual = json.loads(Path('temp/.semantic-residual-repair.json').read_text(encoding='utf-8'))
          payload = {
              'summary': src.get('summary', {}),
              'issue_counts': src.get('issue_counts', {}),
              'semantic_residual_summary': residual.get('summary', {}),
              'review_file_count': len(review),
              'review': review,
              'unresolved_box_markers': residual.get('unresolved_box_markers', []),
          }
          Path('temp/.content-format-review.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload['summary'], ensure_ascii=False, indent=2))
          print(json.dumps(payload['semantic_residual_summary'], ensure_ascii=False, indent=2))
          print('review_file_count=', len(review))
          PY

      - name: Commit prompt, repaired content and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .prompt temp
          if git diff --cached --quiet; then
            echo 'No semantic residual changes detected.'
          else
            git commit -m 'docs(markdown): repair semantic formatting omissions [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
