name: Extract Low Density Numbered Sections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-low-density-numbered-sections.yml'
      - 'scripts/extract_low_density_numbered_sections.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Extract candidates
        run: python scripts/extract_low_density_numbered_sections.py
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.low-density-numbered-section-candidates.json
          if git diff --cached --quiet; then
            echo 'Diagnostic unchanged.'
          else
            git commit -m 'chore(temp): refresh low-density section candidates [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
