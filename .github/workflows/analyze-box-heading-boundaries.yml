name: Analyze Box Heading Boundaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-box-heading-boundaries.yml'
      - 'scripts/analyze_box_heading_boundaries.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Analyze only; do not edit books
        run: |
          python scripts/analyze_box_heading_boundaries.py
          cat temp/.box-heading-boundary-analysis.json
      - name: Commit analysis report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.box-heading-boundary-analysis.json
          if git diff --cached --quiet; then
            echo 'Boundary analysis unchanged.'
          else
            git commit -m 'chore(temp): refresh boxed heading boundary analysis [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
