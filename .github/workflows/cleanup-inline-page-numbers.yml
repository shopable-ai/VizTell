name: Clean Inline OCR Page Numbers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-inline-page-numbers.yml'
      - 'scripts/cleanup_inline_page_numbers.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove inline OCR pagination tokens
        run: |
          python scripts/cleanup_inline_page_numbers.py \
            --source-report temp/.raw-format-report.json \
            --report temp/.inline-page-number-cleanup.json
          cat temp/.inline-page-number-cleanup.json
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp
          if git diff --cached --quiet; then
            echo 'No inline page-number tokens remain.'
            exit 0
          fi
          git commit -m 'docs(temp): remove inline OCR page numbers [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
