name: Normalize Temp Root Markdown Heading Hierarchy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-temp-root-headings.yml'
      - 'scripts/normalize_temp_root_headings.py'
  workflow_dispatch:

concurrency:
  group: normalize-temp-root-headings-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  normalize-root-headings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize only high-confidence root Markdown heading hierarchies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_temp_root_headings.py \
            --root temp \
            --apply \
            --report temp/.root-heading-normalization.json
          cat temp/.root-heading-normalization.json

      - name: Commit safe heading-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp

          if git diff --cached --quiet; then
            echo 'No safe root heading changes detected.'
            exit 0
          fi

          git commit -m 'docs(temp): normalize root Markdown heading hierarchy [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
