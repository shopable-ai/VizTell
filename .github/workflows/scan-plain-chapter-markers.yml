name: Scan Plain Chapter Markers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan-plain-chapter-markers.yml'
      - 'scripts/scan_plain_chapter_markers.py'
  workflow_dispatch:
concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git fetch origin main
          git rebase origin/main
      - run: python scripts/scan_plain_chapter_markers.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.plain-chapter-marker-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(temp): refresh plain chapter marker review [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
