name: Final Validate Temp Markdown Corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-validate-temp-markdown-corpus.yml'
      - 'scripts/final_validate_temp_markdown_corpus.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Refresh objective semantic audit
        run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/summarize_semantic_audit_issues.py
      - name: Refresh explicit promo scan
        run: python scripts/summarize_explicit_promo_tokens.py
      - name: Final corpus validation
        run: python scripts/final_validate_temp_markdown_corpus.py
      - name: Commit final validation reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp/.semantic-completeness-audit.json temp/.semantic-audit-issue-index.tsv temp/.semantic-audit-issue-summary.json temp/.explicit-promo-token-summary.json temp/.final-markdown-corpus-validation.json
          if git diff --cached --quiet; then
            echo 'Final validation reports unchanged.'
            exit 0
          fi
          git commit -m 'chore(temp): record final Markdown corpus validation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
