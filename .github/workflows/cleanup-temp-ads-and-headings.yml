name: Cleanup Temp Ads and Headings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-temp-ads-and-headings.yml'
      - 'scripts/cleanup_temp_ads_and_headings.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove ads and repair heading hierarchy
        run: |
          set +e
          python scripts/cleanup_temp_ads_and_headings.py \
            --root temp \
            --prompt '.prompt/Markdown文档整理与修复通用提示词.md' \
            --report temp/.ad-heading-cleanup-report.json
          rc=$?
          echo "cleanup exit code: $rc"
          cat temp/.ad-heading-cleanup-report.json
          exit 0
      - name: Commit cleaned Markdown and audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp '.prompt/Markdown文档整理与修复通用提示词.md'
          if git diff --cached --quiet; then
            echo 'No Markdown cleanup changes required.'
            exit 0
          fi
          git commit -m 'docs(temp): remove ads and repair headings [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
