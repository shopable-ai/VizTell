name: Cleanup Temp Ads and Headings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-temp-ads-and-headings.yml'
      - 'scripts/cleanup_temp_ads_and_headings.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove ads and repair only provable heading damage
        shell: bash
        run: |
          set +e
          log='temp/.ad-heading-cleanup.log'
          report='temp/.ad-heading-cleanup-report.json'
          : > "$log"

          python -m py_compile scripts/cleanup_temp_ads_and_headings.py >> "$log" 2>&1
          compile_rc=$?
          echo "compile exit code: $compile_rc" >> "$log"

          cleanup_rc=1
          if [ "$compile_rc" -eq 0 ]; then
            python scripts/cleanup_temp_ads_and_headings.py \
              --root temp \
              --prompt '.prompt/Markdown文档整理与修复通用提示词.md' \
              --report "$report" >> "$log" 2>&1
            cleanup_rc=$?
            echo "cleanup exit code: $cleanup_rc" >> "$log"
          fi

          cat "$log"
          if [ -f "$report" ]; then
            cat "$report"
          fi

          # Successful runs should not leave temporary diagnostic noise in the
          # knowledge-base directory. Keep the log only when the script fails.
          if [ "$compile_rc" -eq 0 ] && [ "$cleanup_rc" -eq 0 ]; then
            rm -f "$log"
          fi
          exit 0

      - name: Commit cleaned Markdown and audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp '.prompt/Markdown文档整理与修复通用提示词.md'
          if git diff --cached --quiet; then
            echo 'No Markdown cleanup changes required.'
            exit 0
          fi
          git commit -m 'docs(temp): remove ads and repair headings [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
