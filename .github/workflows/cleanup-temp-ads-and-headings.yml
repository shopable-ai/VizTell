name: Cleanup Temp Ads and Headings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-temp-ads-and-headings.yml'
      - 'scripts/cleanup_temp_ads_and_headings.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove ads and repair heading hierarchy
        run: |
          set +e
          : > temp/.ad-heading-cleanup.log
          python -m py_compile scripts/cleanup_temp_ads_and_headings.py >> temp/.ad-heading-cleanup.log 2>&1
          compile_rc=$?
          echo "compile exit code: $compile_rc" >> temp/.ad-heading-cleanup.log
          if [ "$compile_rc" -eq 0 ]; then
            python scripts/cleanup_temp_ads_and_headings.py \
              --root temp \
              --prompt '.prompt/Markdown文档整理与修复通用提示词.md' \
              --report temp/.ad-heading-cleanup-report.json >> temp/.ad-heading-cleanup.log 2>&1
            echo "cleanup exit code: $?" >> temp/.ad-heading-cleanup.log
          fi
          cat temp/.ad-heading-cleanup.log
          if [ -f temp/.ad-heading-cleanup-report.json ]; then
            cat temp/.ad-heading-cleanup-report.json
          fi
          exit 0
      - name: Commit cleaned Markdown and audit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp '.prompt/Markdown文档整理与修复通用提示词.md'
          if git diff --cached --quiet; then
            echo 'No Markdown cleanup changes required.'
            exit 0
          fi
          git commit -m 'docs(temp): remove ads and repair headings [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
