name: Clean Remaining Promo CTAs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-remaining-promo-ctas.yml'
      - 'scripts/clean_remaining_promo_ctas.py'
  workflow_dispatch:
concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Remove reviewed promo CTAs
        run: python scripts/clean_remaining_promo_ctas.py
      - name: Refresh promo and semantic audits
        run: |
          python scripts/summarize_explicit_promo_tokens.py
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/summarize_semantic_audit_issues.py
      - name: Commit cleaned Markdown and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(temp): remove remaining explicit promo CTAs [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
