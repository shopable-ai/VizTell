name: Format Human Business Transcript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-human-business-transcript.yml'
      - 'scripts/format_human_business_transcript.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Restore explicit course headings and reflow giant transcript lines
        run: |
          python scripts/format_human_business_transcript.py
          cat temp/.human-business-format-repair.json
      - name: Refresh semantic audits
        run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/extract_high_risk_markdown_contexts.py
      - name: Commit formatted transcript and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'temp/《人性商战(线下3天2夜全文字版)》.md' \
            temp/.human-business-format-repair.json \
            temp/.semantic-completeness-audit.json \
            temp/.semantic-high-risk-contexts.json
          if git diff --cached --quiet; then
            echo 'No transcript-format changes detected.'
          else
            git commit -m 'docs(temp): structure human-business transcript from source anchors [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
