name: Repair Confirmed High Risk Markdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-confirmed-high-risk-markdown.yml'
      - 'scripts/repair_confirmed_high_risk_markdown.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Repair confirmed high-risk false passes
        run: |
          python scripts/repair_confirmed_high_risk_markdown.py --root temp --report temp/.confirmed-high-risk-repair.json --apply
          cat temp/.confirmed-high-risk-repair.json
      - name: Refresh semantic completeness audit
        run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/extract_high_risk_markdown_contexts.py
      - name: Commit repairs and refreshed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp
          if git diff --cached --quiet; then
            echo 'No confirmed high-risk changes detected.'
          else
            git commit -m 'docs(temp): repair confirmed high-risk formatting false passes [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
