name: Repair Poverty Duplicate OCR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-poverty-duplicate-ocr.yml'
      - 'scripts/repair_poverty_duplicate_ocr.py'
  workflow_dispatch:

concurrency:
  group: markdown-temp-repair-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Remove only the confirmed duplicate block
        run: |
          python scripts/repair_poverty_duplicate_ocr.py
          cat temp/.poverty-duplicate-ocr-repair.json
      - name: Refresh semantic completeness audit
        run: |
          python scripts/audit_temp_semantic_completeness.py --root temp --report temp/.semantic-completeness-audit.json
          python scripts/extract_high_risk_markdown_contexts.py
      - name: Commit repaired book and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'temp/《穷人的底层逻辑》/index.md' \
            temp/.poverty-duplicate-ocr-repair.json \
            temp/.semantic-completeness-audit.json \
            temp/.semantic-high-risk-contexts.json
          if git diff --cached --quiet; then
            echo 'No poverty duplicate changes detected.'
          else
            git commit -m 'docs(temp): remove confirmed poverty OCR duplicate [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
