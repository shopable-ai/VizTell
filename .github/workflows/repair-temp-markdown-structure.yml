name: Repair Temp Markdown Structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-temp-markdown-structure.yml'
      - 'scripts/repair_temp_markdown_structure.py'
  workflow_dispatch:

concurrency:
  group: repair-temp-markdown-structure-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair naming ads and raw OCR Markdown
        shell: bash
        run: |
          set +e
          python scripts/repair_temp_markdown_structure.py \
            --root temp \
            --prompt '.prompt/Markdown文档整理与修复通用提示词.md' \
            --report temp/.semantic-cleanup-report.json
          code=$?
          set -e
          cat temp/.semantic-cleanup-report.json
          echo "REPAIR_EXIT_CODE=$code" >> "$GITHUB_ENV"

      - name: Commit all safe repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp '.prompt/Markdown文档整理与修复通用提示词.md'
          if git diff --cached --quiet; then
            echo 'No safe Markdown repairs detected.'
          else
            git commit -m 'docs(temp): repair Markdown naming structure and ads [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Report safety-blocked files
        if: env.REPAIR_EXIT_CODE != '0'
        run: |
          echo 'Some files were safety-blocked; successful repairs were committed and details are in temp/.semantic-cleanup-report.json.'
