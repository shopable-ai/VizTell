name: Repair Explicit Box Sections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-explicit-box-sections.yml'
      - 'scripts/repair_explicit_box_sections.py'
  workflow_dispatch:

concurrency:
  group: repair-explicit-box-sections-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase to latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Repair explicit box section markers
        run: |
          python scripts/repair_explicit_box_sections.py \
            --root temp \
            --report temp/.boxed-section-repair.json \
            --apply
          cat temp/.boxed-section-repair.json

      - name: Normalize and audit current content
        run: |
          python scripts/finalize_temp_markdown_invariants.py --root temp --report temp/.format-invariant-repair.json --apply
          python scripts/audit_and_repair_temp_markdown.py --root temp --report temp/.content-format-audit.json --apply

      - name: Commit repaired sections and reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- temp
          if git diff --cached --quiet; then
            echo 'No explicit box-section changes detected.'
          else
            git commit -m 'docs(temp): recover explicit boxed section headings [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
